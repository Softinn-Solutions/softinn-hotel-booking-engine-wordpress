name: Update readme/assets on WordPress.org
# Pushes readme.txt and .wordpress-org/ assets to SVN trunk and the current
# Stable tag WITHOUT cutting a new release. Use for "Tested up to" bumps,
# description tweaks, banners and screenshots.
#
# Run manually from the Actions tab (on master) after the change is merged.
# Only readme.txt and .wordpress-org/ are uploaded; any other changed files
# (e.g. the plugin header) are ignored and go out with the next tagged
# release via deploy.yml.
on:
  workflow_dispatch:

jobs:
  update:
    name: Update readme and assets
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: WordPress.org plugin readme/assets update
      uses: 10up/action-wordpress-plugin-asset-update@stable
      env:
        SVN_USERNAME: ${{ secrets.WORDPRESS_PLUGIN_USERNAME }}
        SVN_PASSWORD: ${{ secrets.WORDPRESS_PLUGIN_PASSWORD }}
        SLUG: softinn-booking-engine
        IGNORE_OTHER_FILES: true
